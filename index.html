<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logo-spot">
                <img src="images/odin-lined.png">
                <h1 class="logo-text">Odin</h1>
            </div>
        </div>
        <div class="right">
            <h2>This is not a real online service! You know you need something 
                like this in your life to help you realize your deepest dreams. 
                Sign up <em>now</em> to get started.
            </h2>
            <h2>You <em>know</em> you want to.</h2>
            <div class="form-container">
                <form>
                    <h2>Let's do this!</h2>
                    <section>
                        <p>
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="firstname" required />
                        </p>
                        <p> 
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="lastname" required />
                        </p>
                        <p>
                            <label for="mail">Email</label>
                            <input type="email" id="mail" name="user-mail" required />
                        </p>
                        <p>
                            <label for="phone-number">Phone Number</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </p>
                        <p>
                            <label for="user-password">Password</label>
                            <input type="password" id="user-password" name="user-password" required />
                        </p>
                        <p>
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" required />
                        </p>                        
                    </section>
                    <button type="submit">Create Account</button>
                </form>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
